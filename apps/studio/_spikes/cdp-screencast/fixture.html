<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login fixture</title>
		<style>
			* { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: radial-gradient(circle at 20% 20%, #d9ffbd, transparent 35%), #eff3eb; color: #182014; }
			.card { width: 390px; padding: 34px; border-radius: 22px; background: #fff; box-shadow: 0 30px 90px #3043232b; animation: arrive .55s ease-out; }
			mark { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: #a8ff60; font-weight: 900; }
			h1 { margin: 24px 0 6px; font-size: 27px; } p { margin: 0 0 24px; color: #6a7365; }
			label { display: grid; gap: 7px; margin: 14px 0; font-size: 13px; font-weight: 650; }
			input { width: 100%; border: 1px solid #d8ded4; border-radius: 10px; padding: 12px; font: inherit; outline: none; } input:focus { border-color: #74aa47; box-shadow: 0 0 0 3px #a8ff6038; }
			button { width: 100%; margin-top: 12px; border: 0; border-radius: 10px; padding: 13px; background: #172012; color: white; font-weight: 750; cursor: pointer; }
			@keyframes arrive { from { opacity: 0; transform: translateY(20px) scale(.98); } }
		</style>
	</head>
	<body>
		<form class="card" action="/fixture/dashboard">
			<mark>B</mark><h1>Welcome back</h1><p>Sign in to continue to your workspace.</p>
			<label>Email<input name="email" type="email" autocomplete="username" /></label>
			<label>Password<input name="password" type="password" autocomplete="current-password" /></label>
			<button type="submit">Sign in</button>
		</form>
	</body>
</html>
