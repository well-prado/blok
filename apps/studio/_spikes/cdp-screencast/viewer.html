<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BLOK Browser Stream Spike</title>
		<style>
			:root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #090b10; color: #f6f7fb; }
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100vh; padding: 28px; background: radial-gradient(circle at 80% 0%, #202b45 0, transparent 35%), #090b10; }
			.shell { max-width: 1500px; margin: auto; }
			header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
			.brand { display: flex; gap: 12px; align-items: center; }
			.mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: #a8ff60; color: #0b1107; font-weight: 900; }
			h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
			.subtitle { color: #8991a3; font-size: 12px; margin-top: 3px; }
			.connection { border: 1px solid #303747; border-radius: 999px; padding: 7px 11px; color: #8d96a9; font-size: 12px; }
			.connection[data-connected="true"] { color: #a8ff60; border-color: #45652c; background: #17210f; }
			.grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; }
			.panel { border: 1px solid #262c38; background: rgba(15, 18, 25, .94); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 80px #0008; }
			.toolbar { height: 45px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #262c38; color: #858da0; font-size: 12px; }
			.dot { width: 8px; height: 8px; border-radius: 50%; background: #353d4d; }
			.url { margin-left: 7px; flex: 1; padding: 7px 11px; border-radius: 8px; background: #0a0d12; color: #6f788b; }
			.viewport { aspect-ratio: 16 / 9; background: #050609; display: grid; place-items: center; }
			.viewport img { display: block; width: 100%; height: 100%; object-fit: contain; }
			.side { padding: 18px; }
			.side h2 { margin: 0 0 14px; font-size: 11px; color: #7f8798; text-transform: uppercase; letter-spacing: .14em; }
			.actions { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 9px; }
			.actions li { display: flex; gap: 9px; align-items: center; padding: 10px; border-radius: 10px; background: #141923; color: #dce1eb; font-size: 13px; }
			.actions li::before { content: "✓"; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: #253a18; color: #a8ff60; }
			.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
			.stat { padding: 11px; border: 1px solid #272e3b; border-radius: 10px; }
			.stat strong { display: block; font-size: 19px; }
			.stat span { font-size: 10px; color: #737d90; text-transform: uppercase; letter-spacing: .08em; }
			@media (max-width: 850px) { body { padding: 14px; } .grid { grid-template-columns: 1fr; } }
		</style>
	</head>
	<body>
		<div class="shell">
			<header>
				<div class="brand"><div class="mark">B</div><div><h1>Live browser</h1><div class="subtitle">Real Chromium pixels · CDP screencast</div></div></div>
				<div id="connection" class="connection" data-connected="false">Connecting</div>
			</header>
			<div class="grid">
				<section class="panel">
					<div class="toolbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="url">Playwright Chromium · 1280 × 720</div></div>
					<div class="viewport"><img id="frame" alt="Live Chromium viewport" data-frame-count="0" /></div>
				</section>
				<aside class="panel side">
					<h2>Workflow actions</h2>
					<ul id="actions" class="actions" data-action-count="0"></ul>
					<h2>Transport</h2>
					<div class="stats">
						<div class="stat"><strong id="frames">0</strong><span>frames</span></div>
						<div class="stat"><strong id="acks">0</strong><span>acks</span></div>
					</div>
				</aside>
			</div>
		</div>
		<script>
			const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/stream`);
			const image = document.querySelector("#frame");
			const connection = document.querySelector("#connection");
			const actions = document.querySelector("#actions");
			const ackDelay = Number(new URLSearchParams(location.search).get("ackDelay") || 0);
			let pendingFrameId = 0;
			let objectUrl;
			let frameCount = 0;
			let ackCount = 0;
			socket.binaryType = "blob";
			socket.onopen = () => { connection.dataset.connected = "true"; connection.textContent = "Live"; };
			socket.onclose = () => { connection.dataset.connected = "false"; connection.textContent = "Closed"; };
			socket.onmessage = (event) => {
				if (typeof event.data === "string") {
					const message = JSON.parse(event.data);
					if (message.type === "frame") pendingFrameId = message.frameId;
					if (message.type === "action" && message.phase === "completed") {
						const item = document.createElement("li"); item.textContent = message.name; actions.append(item);
						actions.dataset.actionCount = String(actions.children.length);
					}
					return;
				}
				const nextUrl = URL.createObjectURL(event.data);
				image.onload = () => {
					if (objectUrl) URL.revokeObjectURL(objectUrl); objectUrl = nextUrl;
					frameCount++; image.dataset.frameCount = String(frameCount); document.querySelector("#frames").textContent = String(frameCount);
					setTimeout(() => { socket.send(JSON.stringify({ type: "ack", frameId: pendingFrameId })); ackCount++; document.querySelector("#acks").textContent = String(ackCount); }, ackDelay);
				};
				image.src = nextUrl;
			};
		</script>
	</body>
</html>
