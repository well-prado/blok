[project]
name = "blok-kernel"
version = "3.0.0a0"
description = "Blok as a pattern, in Python: nodes with contracts, workflows as data, and one small runtime you call from your own server, schedule, queue or tool server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
mcp = ["mcp>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every node of the fixture project has a test_node.py, so test files are told apart by path.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fixture/built"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
