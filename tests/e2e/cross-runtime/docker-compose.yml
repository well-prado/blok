# Cross-Runtime gRPC E2E Infrastructure
#
# Builds + boots all 8 SDK runtimes in gRPC mode — the transport the runner
# actually uses (HttpRuntimeAdapter was removed in v0.5). Each container serves
# the canonical `blok.runtime.v1.NodeRuntime` service; the spec-b harness drives
# them through the runner's OWN GrpcRuntimeAdapter.
#
# gRPC port convention = HTTP port + 1000 (see sdks/CLAUDE.md): Go 10001,
# Rust 10002, Java 10003, C# 10004, PHP 10005, Ruby 10006, Python3 10007, Dart 10008.
# Host ports mirror the container ports so the harness needs no env plumbing.
#
# Each build context is `.build/<lang>/` — produced by prepare-usernodes.ts with
# a scaffolded `e2e-user` node baked in (real codegen for compiled langs, a
# BLOK_NODES_DIR node-dir for dynamic ones). This proves user-authored nodes are
# discovered + executed in every SDK, not just the built-in examples (E05-T007).
#
# Usage:
#   bun tests/e2e/cross-runtime/prepare-usernodes.ts   # MUST run first (creates .build/)
#   docker compose up -d --build
#   bun tests/e2e/cross-runtime/spec-b-typed-e2e.ts    # BLOK_E2E_REQUIRE_ALL=1 in CI
#   docker compose down -v

# ADR 0014 — one shared claim-check directory for the whole harness. The runner
# (running on the HOST, via GrpcRuntimeAdapter) writes an oversized `inputs`
# payload to ./.blobs and sends a `{"$blokBlob"}` reference; every SDK container
# sees the same bytes at /blok-blobs and resolves it. Setting BLOK_BLOB_DIR is
# also what makes each SDK advertise `blob-v1` on ListNodes, which is what the
# harness asserts.
x-blob-volume: &blob-volume
  - ./.blobs:/blok-blobs
x-blob-env: &blob-env
  BLOK_BLOB_DIR: /blok-blobs

services:
  sdk-go:
    build:
      context: .build/go/.blok/runtimes/go
    ports:
      - "10001:10001"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      BLOK_TRANSPORT: grpc
      GRPC_PORT: "10001"

  sdk-rust:
    build:
      context: .build/rust/.blok/runtimes/rust
    ports:
      - "10002:10002"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      ENABLE_GRPC: "true"
      GRPC_PORT: "10002"
      RUST_LOG: info

  sdk-java:
    build:
      context: .build/java/.blok/runtimes/java
    ports:
      - "10003:10003"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      BLOK_TRANSPORT: grpc
      GRPC_PORT: "10003"

  sdk-csharp:
    build:
      context: .build/csharp/.blok/runtimes/csharp
    ports:
      - "10004:10004"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      BLOK_TRANSPORT: grpc
      GRPC_PORT: "10004"

  sdk-php:
    # gRPC is served by RoadRunner (rr serve) — the image's default CMD.
    build:
      context: .build/php
    ports:
      - "10005:10005"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      GRPC_PORT: "10005"
      BLOK_NODES_DIR: /app/e2e_usernodes

  sdk-ruby:
    build:
      context: .build/ruby
    ports:
      - "10006:10006"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      BLOK_TRANSPORT: grpc
      GRPC_PORT: "10006"
      BLOK_NODES_DIR: /app/e2e_usernodes

  sdk-python3:
    # The Dockerfile's last stage is `worker` (NATS); the runner needs `runtime`.
    build:
      context: .build/python3
      target: runtime
    ports:
      - "10007:10007"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      BLOK_TRANSPORT: grpc
      GRPC_PORT: "10007"
      BLOK_NODES_DIR: /app/e2e_usernodes

  sdk-dart:
    build:
      context: .build/dart/.blok/runtimes/dart
    ports:
      - "10008:10008"
    volumes: *blob-volume
    environment:
      <<: *blob-env
      BLOK_TRANSPORT: grpc
      GRPC_PORT: "10008"
