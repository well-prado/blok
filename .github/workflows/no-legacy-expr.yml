name: No legacy expression strings

# `js/ctx....` and `${ctx....}` are the runtime wire format the load-boundary
# lowering pass emits, not an authoring API (issue #690, ADR 0001). This gate
# keeps them off the public authoring surface. It's a plain `git grep`, no
# build/install needed, so it runs on EVERY push/PR with no paths-ignore —
# unlike integration.yml and scaffold-smoke.yml, which skip docs-only changes
# for speed. Docs are exactly where a stray old-style example creeps back in.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: no-legacy-expr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: No legacy mapper expressions on the authoring surface
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
      - name: No legacy expression check
        run: bash scripts/check-no-legacy-expr.sh
